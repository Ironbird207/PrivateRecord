plugins {
    id 'com.android.application'
}

android {
    namespace 'org.privaterecord'
    compileSdk 35

    defaultConfig {
        applicationId 'org.privaterecord'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
